# AES 1.4.1 — workflow de CI del proyecto (capa L3). Ver standard/05 §12, 07 §7–9 y profiles/reference/claude-code-subagents/README.md.
#
# Dos ramas protegidas: dev (lo integrado) y main (lo liberado). Un único job "aes" (el check
# obligatorio de ambos rulesets). Primero se comprueba la ruta: a main solo llegan releases
# (dev → main) y hotfixes (ramas de un BUG-NNN). Después, según la rama:
#   spec/<ID>         build/test + RED de los comandos de verificación nuevos + regresión
#   qa/<ID>           compuerta de estabilización + build/test + RED de las pruebas de <ID> (con trazabilidad)
#                     y de sus comandos de verificación nuevos
#   task/<ID>/<TASK>  invalidar aprobaciones viejas + compuerta (solo Crítica) + guardián (desde la base)
#                     + build/test + SAST de lo nuevo + criterios de la tarea (.criteria; sin él, el elemento completo)
#                     + regresión + verificación aprobada (etiqueta aes:verified)
#   spec/<ID>-close   build/test + el elemento completo (debe ejecutarse y pasar) + regresión
#   dev → main        release: compuerta (sin exenciones) + main contenido en dev + regresión completa
#   main → dev        back-merge: regresión completa
#   push a dev/main   build/test + regresión + informe de la compuerta (y en dev, aviso si main no está contenido)
#
# Los scripts de ci/ se toman SIEMPRE de la rama destino (dev o main), nunca de la rama del PR.
# La sección marcada «STACK» es específica del proyecto (.NET + React en el ejemplo): sustitúyela.
name: aes

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write   # quitar aprobaciones viejas tras commits nuevos
  issues: write          # leer quién puso cada etiqueta y quitarla (las etiquetas de un PR son de su issue)

concurrency:
  group: aes-${{ github.ref }}
  cancel-in-progress: true

env:
  AES_APPROVERS: ${{ vars.AES_APPROVERS }}          # logins que pueden aprobar, separados por coma
  AES_MINOR_LIMIT: ${{ vars.AES_MINOR_LIMIT || '5' }}
  AES_REQUIRE_VERIFIED: ${{ vars.AES_REQUIRE_VERIFIED || '1' }}

jobs:
  aes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo para comparar con la base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scripts de AES desde la rama destino
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: |
          mkdir -p "$RUNNER_TEMP/aes"
          for f in aes-ctx.sh aes-guard.sh defect-gate.sh run-verify.sh label-approver.sh red-check.mjs; do
            if git cat-file -e "$BASE:ci/$f" 2>/dev/null; then
              git show "$BASE:ci/$f" > "$RUNNER_TEMP/aes/$f"
            elif [[ -f "ci/$f" ]]; then
              echo "::warning::ci/$f aún no existe en la base: se usa la copia de la rama (solo en el PR que lo introduce)."
              cp "ci/$f" "$RUNNER_TEMP/aes/$f"
            fi
          done
          echo "AES_CI=$RUNNER_TEMP/aes" >> "$GITHUB_ENV"
          echo "AES_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Contexto AES (qué se ejecuta en esta rama)
        id: ctx
        env:
          EVENT: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          BASE="$AES_BASE" bash "$AES_CI/aes-ctx.sh" | tee -a "$GITHUB_OUTPUT"

      - name: Ruta permitida (07 §7–9)
        if: ${{ steps.ctx.outputs.route_error != '' }}
        env:
          MSG: ${{ steps.ctx.outputs.route_error }}
        run: |
          echo "::error::$MSG"
          exit 1

      - name: main contenido en dev
        if: ${{ steps.ctx.outputs.kind == 'release' || (github.event_name == 'push' && github.ref_name == 'dev') }}
        env:
          KIND: ${{ steps.ctx.outputs.kind }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            echo "main está contenido en dev."
          elif [[ "$KIND" == "release" ]]; then
            echo "::error::main tiene commits que dev no tiene (un hotfix o un release sin back-merge). Integra primero el back-merge main → dev, con merge commit (AES 07 §9)."
            exit 1
          else
            echo "::warning::main tiene commits que dev no tiene. Falta un back-merge main → dev (AES 07 §9); el próximo release fallará hasta hacerlo."
          fi

      # ---------- Aprobaciones humanas ----------
      - name: Invalidar aprobaciones tras commits nuevos
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # Una aprobación vale para los commits que vio quien la dio. Excepción: aes:deps-approved se
          # conserva si los commits nuevos no cambian manifiestos ni lockfiles (la aprobación cubre las
          # mismas dependencias). Si no se puede comprobar (force push, script antiguo), se quita.
          for l in aes:verified aes:deps-approved aes:markers-approved; do
            if [[ ",$LABELS," == *",$l,"* ]]; then
              if [[ "$l" == aes:deps-approved ]] && grep -q -- '--deps-changed' "$AES_CI/aes-guard.sh" \
                 && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER" \
                 && [[ -z "$(bash "$AES_CI/aes-guard.sh" --deps-changed "$BEFORE" "$AFTER")" ]]; then
                echo "Se conserva '$l': los commits nuevos no cambian dependencias."
                continue
              fi
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$(jq -rn --arg l "$l" '$l|@uri')" --silent
              echo "Quitada '$l': hay commits nuevos desde la aprobación."
            fi
          done

      - name: Aprobaciones válidas (quién puso cada etiqueta)
        id: approvals
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "deps=$(bash "$AES_CI/label-approver.sh" aes:deps-approved)" >> "$GITHUB_OUTPUT"
          echo "markers=$(bash "$AES_CI/label-approver.sh" aes:markers-approved)" >> "$GITHUB_OUTPUT"
          echo "verified=$(bash "$AES_CI/label-approver.sh" aes:verified)" >> "$GITHUB_OUTPUT"

      # ---------- Compuerta de estabilización (02 §9) ----------
      - name: Compuerta de estabilización
        env:
          KIND: ${{ steps.ctx.outputs.kind }}
          ITEM: ${{ steps.ctx.outputs.item }}
        run: |
          case "$KIND" in
            qa)   BASE="$AES_BASE" bash "$AES_CI/defect-gate.sh" start "$ITEM" ;;
            task) BASE="$AES_BASE" bash "$AES_CI/defect-gate.sh" work "$ITEM" ;;
            release) BASE=HEAD bash "$AES_CI/defect-gate.sh" release "" ;;
            push) BASE=HEAD bash "$AES_CI/defect-gate.sh" report "" || true ;;
            *)    echo "Sin compuerta en ramas de tipo $KIND." ;;
          esac

      # ---------- Guardián (ramas de programador) ----------
      - name: Guardián AES (copia de la rama destino)
        if: ${{ steps.ctx.outputs.kind == 'task' }}
        env:
          BASE_REF: ${{ env.AES_BASE }}
          TASK_SCOPE_FILE: specs/${{ steps.ctx.outputs.item }}/${{ steps.ctx.outputs.task }}.scope
          AES_ALLOW_MARKERS: ${{ steps.approvals.outputs.markers }}
          AES_ALLOW_DEPS: ${{ steps.approvals.outputs.deps }}
        run: bash "$AES_CI/aes-guard.sh"

      # ---------- Análisis estático de seguridad (05 §7) ----------
      - name: SAST sobre lo que cambia la tarea (Semgrep, OWASP)
        if: ${{ steps.ctx.outputs.kind == 'task' && vars.AES_SAST != '0' }}
        env:
          SEMGREP_RULES: ${{ vars.AES_SAST_CONFIG || 'p/owasp-top-ten' }}
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          # Solo hallazgos NUEVOS respecto de la base. ERROR falla la tarea (ciclo FAIL);
          # WARNING/INFO se muestran para que el orquestador los registre como defectos (02 §9).
          # Las supresiones (nosemgrep) son marcadores del guardián: exigen aprobación humana.
          # Va antes de restaurar la suite: el árbol de trabajo debe coincidir con HEAD.
          pipx install semgrep >/dev/null 2>&1 || pip install --user semgrep >/dev/null
          base=$(git merge-base "$AES_BASE" HEAD)
          semgrep scan --config "$SEMGREP_RULES" --baseline-commit "$base" --metrics=off --severity WARNING --severity INFO || true
          semgrep scan --config "$SEMGREP_RULES" --baseline-commit "$base" --metrics=off --severity ERROR --error

      # ---------- Detector de interfaz (05 §7; impeccable, si está instalada) ----------
      - name: Detector de interfaz sobre lo que cambia la tarea (impeccable)
        if: ${{ steps.ctx.outputs.kind == 'task' && vars.AES_UI_DETECT != '0' && hashFiles('.claude/skills/impeccable/scripts/impeccable') != '' }}
        env:
          IMPECCABLE_NO_UPDATE_CHECK: '1'
          DO_NOT_TRACK: '1'
          BLOCKING: ${{ vars.AES_UI_DETECT == 'block' && '1' || '0' }}
        run: |
          # Solo anota en el PR mientras el proyecto no decida qué reglas bloquean (AES_UI_DETECT=block).
          # El motor se descarga en su versión fija y se verifica con las huellas de la skill.
          base=$(git merge-base "$AES_BASE" HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$base"...HEAD \
            | grep -E '\.(html|css|scss|sass|less|tsx|jsx|vue|svelte|astro)$' || true)
          if [[ ${#files[@]} -eq 0 ]]; then echo "La tarea no cambia archivos de interfaz."; exit 0; fi
          rc=0; bash .claude/skills/impeccable/scripts/impeccable detect --github "${files[@]}" || rc=$?
          case "$rc" in
            0) echo "Sin hallazgos." ;;
            2) echo "Hallazgos de interfaz: el orquestador los registra como defectos (02 §9)."; [[ "$BLOCKING" == 1 ]] && exit 1 || true ;;
            *) echo "::warning::El detector de interfaz no pudo ejecutarse (código $rc)." ;;
          esac

      - name: Restaurar suite de aceptación y especificaciones desde la rama destino
        if: ${{ steps.ctx.outputs.kind == 'task' }}
        run: |
          for p in tests/acceptance specs; do
            if git cat-file -e "$AES_BASE:$p" 2>/dev/null; then
              rm -rf "$p"; git checkout "$AES_BASE" -- "$p"; echo "$p restaurado desde $AES_BASE."
            fi
          done

      # ---------- STACK: compilación y pruebas del proyecto (Rust + React) ----------
      # Mantén estos comandos alineados con ci/validate.sh.
      - name: Instalar Rust
        if: ${{ hashFiles('src/server/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Rust
        if: ${{ hashFiles('src/server/Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/server -> target

      - name: Formato, lint, pruebas y build (servidor)
        if: ${{ hashFiles('src/server/Cargo.toml') != '' }}
        working-directory: src/server
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --locked

      - name: Instalar cargo-audit
        if: ${{ hashFiles('src/server/Cargo.lock') != '' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Auditoría de dependencias (servidor)
        if: ${{ hashFiles('src/server/Cargo.lock') != '' }}
        working-directory: src/server
        run: cargo audit

      - name: Instalar Node
        if: ${{ hashFiles('src/web/package.json', 'tests/acceptance/package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint, tipos, pruebas, build y auditoría (web)
        if: ${{ hashFiles('src/web/package.json') != '' }}
        working-directory: src/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      # ---------- fin de STACK ----------

      # ---------- Aceptación (Playwright) ----------
      - name: Preparar Playwright
        id: pw
        if: ${{ hashFiles('tests/acceptance/package.json') != '' }}
        working-directory: tests/acceptance
        run: |
          npm ci
          npx playwright install --with-deps chromium
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # ---------- Comandos de verificación (05 §12) ----------
      - name: RED de los comandos de verificación nuevos
        if: ${{ steps.ctx.outputs.verify_red != '' }}
        env:
          FILES: ${{ steps.ctx.outputs.verify_red }}
        run: |
          # shellcheck disable=SC2086
          bash "$AES_CI/run-verify.sh" red HEAD $FILES

      - name: Comandos de verificación (elemento en curso y regresión)
        if: ${{ steps.ctx.outputs.verify_green != '' }}
        env:
          FILES: ${{ steps.ctx.outputs.verify_green }}
          REF: ${{ steps.ctx.outputs.reg_ref }}
        run: |
          # shellcheck disable=SC2086
          bash "$AES_CI/run-verify.sh" green "$REF" $FILES

      - name: RED automático y trazabilidad (rama qa/<ID>)
        if: ${{ steps.pw.outputs.ready == 'true' && steps.ctx.outputs.kind == 'qa' }}
        working-directory: tests/acceptance
        env:
          ITEM: ${{ steps.ctx.outputs.item }}
          VERIFY_RED: ${{ steps.ctx.outputs.verify_red }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/red-report.json
        run: |
          echo "Las pruebas de @$ITEM deben EJECUTARSE y FALLAR contra el código actual (AES 05 §2.2)."
          # «RED de arranque» solo si la base todavía no tiene código de aplicación (ajusta la ruta a tu stack).
          bootstrap=0
          git cat-file -e "$AES_BASE:src" 2>/dev/null || bootstrap=1
          spec="../../specs/$ITEM/$ITEM.md"
          n=$(npx playwright test --list --grep "@$ITEM(?![\\w-])" 2>/dev/null | sed -n 's/^Total: \([0-9]*\) test.*/\1/p')
          if [[ "${n:-0}" == "0" ]]; then
            if [[ -n "$VERIFY_RED" ]]; then
              echo "@$ITEM no tiene pruebas de Playwright: sus criterios se comprueban por comando de verificación (paso anterior)."
              exit 0
            fi
            echo "::error::@$ITEM no tiene pruebas de aceptación ni comandos de verificación nuevos: no hay nada que demuestre RED."
            exit 1
          fi
          npx playwright test --grep "@$ITEM(?![\\w-])" --reporter=list,json || true
          node "$AES_CI/red-check.mjs" "$PLAYWRIGHT_JSON_OUTPUT_NAME" "$ITEM" "$bootstrap" "$spec"

      - name: Aceptación (elemento en curso + regresión)
        if: ${{ steps.pw.outputs.ready == 'true' && steps.ctx.outputs.kind != 'qa' }}
        working-directory: tests/acceptance
        env:
          WANTED: ${{ steps.ctx.outputs.wanted }}
          ACTIVE: ${{ steps.ctx.outputs.active }}
          VERIFY: ${{ steps.ctx.outputs.verify_green }}
        run: |
          # Cada etiqueta del elemento en curso debe tener pruebas, salvo un defecto que se
          # comprueba solo por comando de verificación. Así una etiqueta mal escrita no pasa en verde.
          count() { npx playwright test --list --grep "@$1(?![\\w-])" 2>/dev/null | sed -n 's/^Total: \([0-9]*\) test.*/\1/p'; }
          for tag in $(tr '|' ' ' <<< "$WANTED"); do
            n=$(count "$tag"); n=${n:-0}
            if [[ "$n" == "0" ]]; then
              if [[ " $VERIFY " == *"/$tag.verify "* ]]; then
                echo "@$tag se comprueba por comando de verificación (sin pruebas de Playwright)."
              else
                echo "::error::No hay pruebas de aceptación para @$tag. Revisa las etiquetas o el archivo .criteria."
                exit 1
              fi
            else
              echo "@$tag: $n pruebas."
            fi
          done
          tags=$(printf '%s|%s' "$WANTED" "$ACTIVE" | tr '|' '\n' | { grep -v '^$' || true; } | sort -u | sed 's/.*/@&(?![\\w-])/' | paste -sd'|')
          if [[ -z "$tags" ]]; then
            echo "No hay elementos en curso ni en regresión: no se ejecuta aceptación."
            exit 0
          fi
          echo "Ejecutando aceptación para: $tags"
          npx playwright test --grep "$tags" --pass-with-no-tests --reporter=list

      - name: Publicar reporte de Playwright
        if: ${{ always() && steps.pw.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/acceptance/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      # ---------- Verificación independiente antes de integrar (06 §8) ----------
      - name: PASS del verificador aprobado (etiqueta aes:verified)
        if: ${{ steps.ctx.outputs.kind == 'task' && env.AES_REQUIRE_VERIFIED == '1' }}
        env:
          VERIFIED: ${{ steps.approvals.outputs.verified }}
        run: |
          if [[ "$VERIFIED" != "1" ]]; then
            echo "::error::Falta 'aes:verified': el responsable humano la pone tras leer el PASS del verificador. Si todo lo demás está en verde, este fallo es esperado y NO cuenta como ciclo FAIL."
            exit 1
          fi
          echo "Verificación aprobada."
